# Security configuration for Nessi.dev

# JWT settings
jwt:
  secret: "your-secret-key-here"  # Change this in production
  expiration: 24h  # Token expiration time

# TLS settings
tls:
  enabled: true
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"
  min_version: "TLS12"

# Rate limiting
rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

# IP allowlist
ip_allowlist:
  enabled: true
  allowed_ips:
    - "127.0.0.1"
    - "::1"
    - "192.168.1.0/24"

# Role definitions
roles:
  admin:
    permissions:
      - "tables:read"
      - "tables:write"
      - "tables:delete"
      - "extensions:manage"
      - "security:manage"
      - "monitoring:manage"
  
  user:
    permissions:
      - "tables:read"
      - "tables:write"
      - "extensions:use"
  
  viewer:
    permissions:
      - "tables:read"
      - "monitoring:view"

# Default role for new users
default_role: "viewer"

# Security headers
security_headers:
  enabled: true
  hsts:
    enabled: true
    max_age: 31536000  # 1 year
    include_subdomains: true
    preload: true
  content_security_policy:
    enabled: true
    default_src: "'self'"
    script_src: "'self' 'unsafe-inline' 'unsafe-eval'"
    style_src: "'self' 'unsafe-inline'"
    img_src: "'self' data: https:"
    connect_src: "'self'"
  x_content_type_options: "nosniff"
  x_frame_options: "DENY"
  x_xss_protection: "1; mode=block"
  referrer_policy: "strict-origin-when-cross-origin" 