global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'nessi-monitor'

scrape_configs:
  - job_name: 'nessi'
    static_configs:
      - targets: ['nessi-api:8000']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

rule_files:
  - 'alert.rules'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093' 