sonar.projectKey=nessi-dev_nessi
sonar.organization=nessi-dev

# Project metadata
sonar.projectName=Nessi
sonar.projectVersion=1.0

# Path to source directories
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/*.pb.go

# Path to test directories
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Technical debt settings
sonar.qualitygate.wait=true

# Disable SCM sensor as we use GitHub
sonar.scm.disabled=false
sonar.scm.provider=git

# Additional settings
sonar.verbose=false
sonar.cpd.exclusions=**/*_test.go,**/vendor/**,**/testdata/**
