name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Environment variables used across jobs
env:
  GO_VERSION: '1.21'
  COVERAGE_THRESHOLD: 70

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
      
      - name: Run unit tests
        run: go test -v -race -short -coverprofile=coverage.out ./...
      
      - name: Run integration tests
        run: go test -v -race -tags=integration ./...
        
      - name: Check test coverage
        run: |
          go tool cover -func=coverage.out > coverage.txt
          COVERAGE=$(grep -Po 'total:\s+\(statements\)\s+\K[\d\.]+' coverage.txt)
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Test coverage is below threshold: $COVERAGE% < ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          
      - name: Generate coverage HTML report
        run: go tool cover -html=coverage.out -o coverage.html
        
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage.html
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/sonatype-nexus-community/nancy@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      
      - name: Run gosec
        run: gosec -fmt=json -out=security-report.json ./...
      
      - name: Check dependencies with nancy
        run: |
          go list -json -deps ./... | nancy sleuth -o nancy-report.json
          echo "Nancy vulnerability scan complete"
      
      - name: Run govulncheck
        run: govulncheck -json ./... > govulncheck-report.json
      
      - name: Check for license compliance
        run: |
          go list -m -json all > licenses.json
          echo "License check complete"
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-report.json
            nancy-report.json
            govulncheck-report.json
            licenses.json
  
  databricks-integration-test:
    name: Databricks Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
      
      - name: Run Databricks integration tests
        run: |
          go test -v -tags=integration ./pkg/catalog/databricks/...
          go test -v -tags=integration ./pkg/format/delta/...
      
      - name: Run mock Databricks tests
        run: |
          go test -v ./pkg/catalog/databricks/mock/...
          go test -v ./pkg/format/delta/mock/...
      
      - name: Test error handling
        run: |
          go test -v -run "TestError|TestInvalid" ./pkg/catalog/databricks/...
          go test -v -run "TestError|TestInvalid" ./pkg/format/delta/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m
      
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Run benchmarks
        run: go test -bench=. -benchmem ./... > benchmark-results.txt
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security-scan, lint]
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build for ${{ matrix.os }}-${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(git describe --tags --always --dirty)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          OUTPUT="bin/nessi"
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUTPUT="bin/nessi.exe"
          fi
          
          go build -ldflags "-s -w -X github.com/nessi-dev/nessi/pkg/version.Version=${VERSION} -X github.com/nessi-dev/nessi/pkg/version.BuildDate=${BUILD_DATE} -X github.com/nessi-dev/nessi/pkg/version.GitCommit=${GIT_COMMIT} -X github.com/nessi-dev/nessi/pkg/version.GitBranch=${GIT_BRANCH}" -o ${OUTPUT} ./cmd/nessi
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nessi-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/nessi*
