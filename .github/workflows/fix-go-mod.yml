name: Fix Go Module Format

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [ main ]
    paths:
      - 'go.mod'
      - 'go.sum'

jobs:
  fix-go-mod:
    name: Fix go.mod Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'
          cache: false
      
      - name: Fix go.mod format
        run: |
          ./scripts/fix-go-mod.sh
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code go.mod go.sum || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit changes if needed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add go.mod go.sum
          git commit -m "Fix go.mod format [automated]"
          git push
