name: Fix Go Mod Format

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'go.mod'
      - 'go.sum'

jobs:
  fix-go-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Fix go.mod format
        run: |
          # Fix the invalid Go version format
          sed -i 's/go 1.23.0/go 1.20/' go.mod
          # Remove the toolchain directive
          sed -i '/toolchain go1.24.3/d' go.mod
          # Format the go.mod file
          go mod edit -fmt
          # Regenerate the go.sum file
          go mod tidy

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add go.mod go.sum
          git diff --staged --quiet || git commit -m "Fix go.mod file format: change Go version to 1.20 and remove toolchain directive"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}
