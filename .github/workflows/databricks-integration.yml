name: Databricks Integration Tests

on:
  push:
    branches: [ main, fresh-ci-pipeline ]
    paths:
      - 'pkg/catalog/databricks/**'
      - 'pkg/datalake/**'
      - '.github/workflows/databricks-integration.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/catalog/databricks/**'
      - 'pkg/datalake/**'
      - '.github/workflows/databricks-integration.yml'

jobs:
  test:
    name: Test Databricks Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: true
      
      - name: Fix go.mod file
        run: |
          # Fix the invalid Go version format
          sed -i 's/go 1.23.0/go 1.20/' go.mod
          # Remove the toolchain directive
          sed -i '/toolchain go1.24.3/d' go.mod
          cat go.mod
          
          # Add a replace directive for the klauspost/compress package
          go mod edit -replace=github.com/klauspost/compress=github.com/klauspost/compress@v1.16.7
          
          # Clean the module cache and download dependencies
          go clean -modcache
          go mod tidy
          go mod download
      
      - name: Run Databricks integration tests
        run: |
          # Test only the Databricks integration and Delta Lake packages
          go test -v ./pkg/catalog/databricks/... -short
          go test -v ./pkg/datalake/... -short
      
      - name: Check test coverage
        run: |
          # Generate coverage report for Databricks packages only
          go test -coverprofile=coverage.out ./pkg/catalog/databricks/... ./pkg/datalake/...
          go tool cover -func=coverage.out
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: databricks-coverage-report
          path: coverage.out
          retention-days: 5
