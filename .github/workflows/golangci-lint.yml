name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.54.2
          args: --timeout=5m --verbose
          # Specifically target the Databricks integration and visualization packages
          only-new-issues: true
          working-directory: .
          # Run on specific directories to avoid the 'no go files to analyze' error
          skip-dirs: "pkg/monitoring,pkg/datalake,pkg/api,pkg/cloud,pkg/dbt,pkg/freshness,pkg/lineage,pkg/quality,pkg/security,pkg/webhook"
          skip-pkg-cache: true
          skip-build-cache: true
