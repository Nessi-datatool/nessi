name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: false
      - name: Lint only changed files
        run: |
          # Get list of changed Go files
          CHANGED_FILES=$(git diff --name-only origin/main | grep '\.go$' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No Go files changed, skipping lint"
            exit 0
          fi
          
          # Run gofmt on changed files
          echo "Running gofmt on changed files..."
          echo "$CHANGED_FILES" | xargs -I{} gofmt -l -w {}
          
          # Check if any files were changed by gofmt
          GOFMT_CHANGES=$(git diff --name-only)
          if [ -n "$GOFMT_CHANGES" ]; then
            echo "The following files need formatting:"
            echo "$GOFMT_CHANGES"
            exit 1
          fi
          
          echo "All files are properly formatted!"
          exit 0
