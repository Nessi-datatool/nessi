name: Dependency Updates

on:
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Update Go dependencies
        run: |
          go get -u ./...
          go mod tidy
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code go.mod go.sum || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          body: |
            This PR updates Go dependencies to their latest versions.
            
            ## Updated Dependencies
            ```
            $(git diff --unified=0 go.mod | grep -E '^\+.*' | grep -v '+module' | grep -v '+go ' | sed 's/^\+\s*//')
            ```
            
            This is an automated PR created by the dependency-updates workflow.
          branch: dependencies/update
          base: main
          labels: dependencies,automated
          delete-branch: true
