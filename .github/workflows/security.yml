name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety trufflehog gi
          
      - name: Run Bandit
        run: |
          bandit -r nessi/ -ll -ii
          
      - name: Run Safety
        run: |
          safety check
          
      - name: Run TruffleHog
        run: |
          trufflehog --regex --entropy=False .
          
      - name: Run Gitleaks
        run: |
          gitleaks detect --config-path .github/gitleaks.toml
