name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan

jobs:
  security:
    name: Security Scan with Docker
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build and run security scan
      run: |
        # Build the security scan image
        docker-compose -f docker-compose.test.yml build test-runner
        
        # Run security tools in Docker container
        docker-compose -f docker-compose.test.yml run --rm test-runner bash -c "
          bandit -r src/ -ll -ii && \n          bandit -r tests/ -ll -ii && \n          safety check && \n          trufflehog --regex --entropy=False . && \n          gitleaks detect --config-path .github/gitleaks.toml
        "