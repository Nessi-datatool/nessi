name: Mark and Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:  # Allow manual triggering

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # General settings
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          operations-per-run: 100
          remove-stale-when-updated: true
          
          # Issue specific settings
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions to Nessi!
          close-issue-message: >
            This issue has been automatically closed because it has not had
            recent activity. Please feel free to reopen it if you believe it still needs attention.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'no-stale,security,bug,enhancement,documentation'
          
          # PR specific settings
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions to Nessi!
          close-pr-message: >
            This pull request has been automatically closed because it has not had
            recent activity. Please feel free to reopen it if you believe it still needs attention.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'no-stale,dependencies,security'
          exempt-draft-pr: true
