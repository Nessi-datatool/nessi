name: Viral Features Tests

on:
  push:
    branches: [ main, feature/viral-growth ]
    paths:
      - 'examples/plugins/**'
      - 'cmd/nessi/cli/viral_cmd.go'
      - 'test/plugins/**'
      - 'test/cli/viral_cmd_test.go'
      - '.github/workflows/viral_features_test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'examples/plugins/**'
      - 'cmd/nessi/cli/viral_cmd.go'
      - 'test/plugins/**'
      - 'test/cli/viral_cmd_test.go'
      - '.github/workflows/viral_features_test.yml'

jobs:
  test:
    name: Run Viral Features Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install dependencies
        run: go mod download

      - name: Run plugin unit tests
        run: go test -v ./test/plugins/...

      - name: Run CLI command tests
        run: go test -v ./test/cli/...

      - name: Run end-to-end tests
        run: go test -v ./test/viral_features_test.go

      - name: Upload test logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-logs
          path: |
            test-logs/
            *.log
          retention-days: 5
