name: Branch Protection Check

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  check-branch-protection:
    name: Check Branch Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check for required status checks
        id: check-status
        run: |
          echo "Checking for required status checks..."
          # This step will only pass if all required status checks have passed
          # The workflow itself serves as a required check
          echo "::set-output name=status::success"
      
      - name: Fail if any required checks are failing
        if: steps.check-status.outputs.status != 'success'
        run: |
          echo "Error: Not all required status checks are passing"
          exit 1
