name: Databricks Integration Tests

on:
  push:
    branches: [ main, fresh-ci-pipeline, databricks-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Databricks Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: false
      
      - name: Fix go.mod file format
        run: |
          # Fix the invalid Go version format
          awk 'BEGIN {fixed=0} 
               /^go 1.23.0/ {print "go 1.20"; fixed=1; next} 
               /^toolchain go1.24.3/ {fixed=1; next} 
               {print}' go.mod > go.mod.new
          mv go.mod.new go.mod
          # Format the go.mod file
          go mod edit -fmt
          # Run go mod tidy
          go mod tidy
      
      - name: Fix go.mod file
        run: |
          # Fix the invalid Go version format
          sed -i 's/go 1.23.0/go 1.20/' go.mod
          # Remove the toolchain directive
          sed -i '/toolchain go1.24.3/d' go.mod
          cat go.mod
      
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download
      
      - name: Run Databricks integration tests
        run: |
          # Test only the Databricks integration and Delta Lake packages
          go test -v ./pkg/catalog/databricks/... -short
          go test -v ./pkg/datalake/... -short
      
      - name: Check test coverage
        run: |
          # Generate coverage report for Databricks packages only
          go test -coverprofile=coverage.out ./pkg/catalog/databricks/... ./pkg/datalake/...
          go tool cover -func=coverage.out
