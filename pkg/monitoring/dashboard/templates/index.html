<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nessi Monitoring Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
</head>
<body>
    <header>
        <h1>Nessi Monitoring Dashboard</h1>
        <div class="nav-container">
            <nav>
                <ul>
                    <li><a href="#metrics" class="active">Metrics</a></li>
                    <li><a href="#alerts">Alerts</a></li>
                    <li><a href="/rca">Root Cause Analysis</a></li>
                    <li><a href="#settings">Settings</a></li>
                    <li id="user-menu" style="display: none;">
                        <a href="#" id="username-display">User</a>
                        <div class="dropdown-content">
                            <a href="#" id="logout-link">Logout</a>
                        </div>
                    </li>
                    <li id="login-menu"><a href="/login">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="metrics" class="active-section">
            <div class="section-header">
                <h2>Metrics</h2>
                <div class="controls">
                    <select id="metric-selector">
                        <option value="table_size">Table Size</option>
                        <option value="record_count">Record Count</option>
                        <option value="error_count">Error Count</option>
                        <option value="operation_latency">Operation Latency</option>
                        <option value="rule_violations">Rule Violations</option>
                    </select>
                    <select id="time-range">
                        <option value="1h">Last Hour</option>
                        <option value="6h">Last 6 Hours</option>
                        <option value="24h" selected>Last 24 Hours</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="30d">Last 30 Days</option>
                    </select>
                    <select id="export-format">
                        <option value="csv">CSV</option>
                        <option value="json">JSON</option>
                    </select>
                    <button id="refresh-btn">Refresh</button>
                    <button id="export-btn" class="export-btn">Export</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="metrics-chart"></canvas>
            </div>
            <div class="metrics-table-container">
                <h3>Latest Values</h3>
                <table id="metrics-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Labels</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Metrics data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>

        <section id="alerts">
            <div class="section-header">
                <h2>Alerts</h2>
                <div class="controls">
                    <select id="alert-severity">
                        <option value="all">All Severities</option>
                        <option value="critical">Critical</option>
                        <option value="warning">Warning</option>
                        <option value="ok">OK</option>
                    </select>
                    <button id="refresh-alerts-btn">Refresh</button>
                </div>
            </div>
            <div class="alerts-container">
                <table id="alerts-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Name</th>
                            <th>Severity</th>
                            <th>Message</th>
                            <th>Metadata</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Alerts data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>

        <section id="settings">
            <div class="section-header">
                <h2>Settings</h2>
            </div>
            <div class="settings-container">
                <form id="settings-form">
                    <div class="form-group">
                        <label for="retention-period">Retention Period (days)</label>
                        <input type="number" id="retention-period" min="1" max="365" value="30">
                    </div>
                    <div class="form-group">
                        <label for="snapshot-interval">Snapshot Interval (seconds)</label>
                        <input type="number" id="snapshot-interval" min="60" max="3600" value="300">
                    </div>
                    <div class="form-group">
                        <label for="alert-cooldown">Alert Cooldown Period (seconds)</label>
                        <input type="number" id="alert-cooldown" min="60" max="3600" value="300">
                    </div>
                    <div class="form-group">
                        <button type="submit">Save Settings</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Nessi Data Profiling System</p>
    </footer>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
