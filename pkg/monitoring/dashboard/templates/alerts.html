<!-- This page has been removed in the OSS version. -->
<!-- Alerting and advanced dashboards are only available in LakeDiff Enterprise. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nessi.dev - Alerts Dashboard</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/chart.min.js"></script>
    <script src="/static/js/common.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Nessi.dev</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/data-quality">Data Quality</a></li>
                <li><a href="/alerts" class="active">Alerts</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="dashboard-header">
            <h1>Alerts Dashboard</h1>
            <div class="actions">
                <button id="refresh-btn" class="btn primary">Refresh</button>
                <button id="create-alert-btn" class="btn">Create Alert</button>
                <button id="create-rule-btn" class="btn">Create Rule</button>
            </div>
        </section>

        <section class="alerts-summary">
            <div class="card">
                <h3>Active Alerts</h3>
                <div class="metric" id="active-alerts-count">-</div>
            </div>
            <div class="card">
                <h3>Critical</h3>
                <div class="metric critical" id="critical-alerts-count">-</div>
            </div>
            <div class="card">
                <h3>Warning</h3>
                <div class="metric warning" id="warning-alerts-count">-</div>
            </div>
            <div class="card">
                <h3>Info</h3>
                <div class="metric info" id="info-alerts-count">-</div>
            </div>
        </section>

        <section class="alerts-container">
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter">
                        <option value="all">All</option>
                        <option value="active" selected>Active</option>
                        <option value="acknowledged">Acknowledged</option>
                        <option value="resolved">Resolved</option>
                        <option value="silenced">Silenced</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="type-filter">Type:</label>
                    <select id="type-filter">
                        <option value="all">All</option>
                        <option value="quality">Quality</option>
                        <option value="anomaly">Anomaly</option>
                        <option value="system">System</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="severity-filter">Severity:</label>
                    <select id="severity-filter">
                        <option value="all">All</option>
                        <option value="critical">Critical</option>
                        <option value="warning">Warning</option>
                        <option value="info">Info</option>
                    </select>
                </div>
                <div class="search-group">
                    <input type="text" id="search-input" placeholder="Search alerts...">
                </div>
            </div>

            <div class="alerts-list" id="alerts-list">
                <!-- Alert items will be populated here dynamically -->
                <div class="loading">Loading alerts...</div>
            </div>
        </section>

        <section class="alert-rules">
            <h2>Alert Rules</h2>
            <div class="rules-list" id="rules-list">
                <!-- Rule items will be populated here dynamically -->
                <div class="loading">Loading rules...</div>
            </div>
        </section>
    </main>

    <!-- Alert Details Modal -->
    <div id="alert-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="alert-modal-title">Alert Details</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body" id="alert-modal-body">
                <!-- Alert details will be populated here -->
            </div>
            <div class="modal-footer">
                <button id="acknowledge-btn" class="btn">Acknowledge</button>
                <button id="resolve-btn" class="btn primary">Resolve</button>
                <button id="silence-btn" class="btn">Silence</button>
                <button id="close-modal-btn" class="btn secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Create Alert Modal -->
    <div id="create-alert-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Alert</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="create-alert-form">
                    <div class="form-group">
                        <label for="alert-name">Name:</label>
                        <input type="text" id="alert-name" required>
                    </div>
                    <div class="form-group">
                        <label for="alert-description">Description:</label>
                        <textarea id="alert-description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="alert-type">Type:</label>
                        <select id="alert-type" required>
                            <option value="quality">Quality</option>
                            <option value="anomaly">Anomaly</option>
                            <option value="system">System</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="alert-severity">Severity:</label>
                        <select id="alert-severity" required>
                            <option value="critical">Critical</option>
                            <option value="warning">Warning</option>
                            <option value="info">Info</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="alert-source">Source:</label>
                        <input type="text" id="alert-source" required>
                    </div>
                    <div class="form-group">
                        <label for="alert-labels">Labels (key=value, one per line):</label>
                        <textarea id="alert-labels"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="alert-annotations">Annotations (key=value, one per line):</label>
                        <textarea id="alert-annotations"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="submit-alert-btn" class="btn primary">Create</button>
                <button id="cancel-alert-btn" class="btn secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Create Rule Modal -->
    <div id="create-rule-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Alert Rule</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="create-rule-form">
                    <div class="form-group">
                        <label for="rule-name">Name:</label>
                        <input type="text" id="rule-name" required>
                    </div>
                    <div class="form-group">
                        <label for="rule-description">Description:</label>
                        <textarea id="rule-description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="rule-metric">Metric:</label>
                        <input type="text" id="rule-metric" required>
                    </div>
                    <div class="form-group">
                        <label for="rule-threshold">Threshold:</label>
                        <input type="number" id="rule-threshold" required>
                    </div>
                    <div class="form-group">
                        <label for="rule-operator">Comparison Operator:</label>
                        <select id="rule-operator" required>
                            <option value=">">Greater than (>)</option>
                            <option value=">=">Greater than or equal (>=)</option>
                            <option value="<">Less than (<)</option>
                            <option value="<=">Less than or equal (<=)</option>
                            <option value="==">Equal (==)</option>
                            <option value="!=">Not equal (!=)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rule-severity">Severity:</label>
                        <select id="rule-severity" required>
                            <option value="critical">Critical</option>
                            <option value="warning">Warning</option>
                            <option value="info">Info</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rule-labels">Labels (key=value, one per line):</label>
                        <textarea id="rule-labels"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="submit-rule-btn" class="btn primary">Create</button>
                <button id="cancel-rule-btn" class="btn secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/static/js/alerts.js"></script>
</body>
</html>
