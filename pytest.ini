[pytest]
testpaths = tests tests/report tests/security tests/monitoring tests/scanner src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --durations=10 --cov=src --cov-report=term-missing

# Test categories
markers =
    integration: marks tests as integration tests
    slow: marks tests as slow
    docker: marks tests that require Docker environment

# Enforce Docker-based testing
env =
    DOCKER_TESTING=1
    DOCKER_ENV=true
    PYTHONPATH=/app
    SPARK_HOME=/usr/local/lib/python3.9/site-packages/pyspark
    JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
    PYSPARK_PYTHON=/usr/local/bin/python
    PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
    PYTEST_DOCKER_ONLY=true 