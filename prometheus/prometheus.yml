global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nessi-metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: metrics_user
      password: secure_password
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics' 