version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ssl:/app/ssl
    environment:
      - PYTHONPATH=/app
      - AUTH_ENABLED=true
      - SSL_ENABLED=true
      - METRICS_USERNAME=${METRICS_USERNAME:-metrics_user}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-secure_password}
      - SCENARIO=normal_operation
      - METRICS_INTERVAL=5
      - LOG_LEVEL=INFO
    command: python src/reports/metrics_test.py
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  tests:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ./ssl:/app/ssl
    environment:
      - PYTHONPATH=/app
      - AUTH_ENABLED=true
      - SSL_ENABLED=true
    command: pytest -v --cov=src tests/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: /tmp/prometheus_data
      o: bind 