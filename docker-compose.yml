version: '3.8'

services:
  nessi:
    build:
      context: .
      dockerfile: Dockerfile
    image: nessi:latest
    container_name: nessi
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - TZ=UTC
    networks:
      - nessi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


networks:
  nessi-net:
    driver: bridge 