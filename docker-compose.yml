version: '3.8'

services:
  # Production service
  nessi:
    build:
      context: .
      dockerfile: Dockerfile
    image: nessi:latest
    container_name: nessi
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - TZ=UTC
    networks:
      - nessi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Development service with hot-reload
  nessi-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nessi:dev
    container_name: nessi-dev
    ports:
      - "8081:8080"
    volumes:
      - .:/app
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - TZ=UTC
      - GO_ENV=development
    networks:
      - nessi-net
    command: ["air", "-c", ".air.toml"]
    profiles: ["dev"]

  # Test database for integration testing
  test-db:
    image: postgres:15-alpine
    container_name: nessi-test-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nessi
      - POSTGRES_PASSWORD=nessi
      - POSTGRES_DB=nessi_test
    volumes:
      - test-db-data:/var/lib/postgresql/data
    networks:
      - nessi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessi"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["test", "dev"]

  # MinIO for S3-compatible storage testing
  minio:
    image: minio/minio:latest
    container_name: nessi-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - nessi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["test", "dev"]

  # Create test buckets in MinIO
  minio-init:
    image: minio/mc:latest
    container_name: nessi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/nessi-test;
      /usr/bin/mc policy set public myminio/nessi-test;
      exit 0;
      '
    networks:
      - nessi-net
    profiles: ["test", "dev"]

  # Grafana for visualization testing
  grafana:
    image: grafana/grafana:latest
    container_name: nessi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - nessi-net
    profiles: ["dev"]

networks:
  nessi-net:
    driver: bridge

volumes:
  test-db-data:
  minio-data:
  grafana-data: