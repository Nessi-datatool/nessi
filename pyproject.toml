[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nessi"
version = "1.0.0"
description = "A Docker-based data quality and profiling tool using PySpark and Delta Lake"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "nessi.dev Team", email = "team@nessi.dev" }
]

[project.urls]
Homepage = "https://github.com/nessi-dev/nessi"
Documentation = "https://github.com/nessi-dev/nessi/tree/main/docs"
Repository = "https://github.com/nessi-dev/nessi.git"
Issues = "https://github.com/nessi-dev/nessi/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src"

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
] 