name: Nessi Data Quality Checks
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'data/**'

jobs:
  data-quality-checks:
    runs-on: ubuntu-latest
    env:
      NESSI_LOG_LEVEL: "info"
      NESSI_VALIDATION_THRESHOLD: "0.9"
      DELTA_LAKE_VERSION: "2.3.0"
      NESSI_API_HOST: "https://api.nessi.dev"
      NESSI_API_KEY: "${{ secrets.NESSI_API_KEY }}"
      NESSI_API_SECRET: "${{ secrets.NESSI_API_SECRET }}"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Install Nessi
        run: |
          # Clone Nessi repository
          git clone git@github.com:nessi-dev/nessi.git
          cd nessi
          
          # Build and install Nessi
          make build
          sudo cp bin/nessi /usr/local/bin/
          
          # Verify installation
          nessi version
      
      - name: Set up Delta Lake environment
        run: |
          # Install Python and Delta Lake dependencies
          python -m pip install --upgrade pip
          pip install delta-spark pyarrow pandas
      
      - name: Run data quality checks
        run: |
          # Create a configuration file for the checks
          cat > nessi-config.yaml << EOF
          validation:
            rules:
              - name: "completeness"
                description: "Check for null values"
                severity: "critical"
              - name: "uniqueness"
                description: "Check for duplicate values"
                severity: "high"
              - name: "format"
                description: "Check data format"
                severity: "medium"
          EOF
          
          # Run checks on all Delta tables in the data directory
          for table in data/*/; do
            echo "Running checks on $table"
            nessi validate "$table" --config nessi-config.yaml --format json > "${table//\//_}_results.json"
            
            # Check if validation passed
            if [ $? -ne 0 ]; then
              echo "::error::Data quality checks failed for $table"
              exit 1
            else
              echo "Validation passed! Quality checks for $table completed successfully."
            fi
          done
      
      - name: Generate summary report
        run: |
          # Generate a summary report of all checks
          nessi report generate --input "*.json" --output report.html --format html
      
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: data-quality-results
          path: |
            *_results.json
            report.html
      
      - name: Send notification on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: data-quality-alerts
          SLACK_COLOR: danger
          SLACK_TITLE: Data Quality Checks Failed
          SLACK_MESSAGE: 'Data quality checks failed. See the GitHub Actions run for details.'
          SLACK_FOOTER: 'Powered by Nessi'
      
      - name: Send notification on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: data-quality-alerts
          SLACK_COLOR: good
          SLACK_TITLE: Data Quality Checks Passed
          SLACK_MESSAGE: 'All data quality checks passed successfully.'
          SLACK_FOOTER: 'Powered by Nessi'
      
      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Nessi Data Quality Check Results
          body: |
            Data quality check results for ${{ github.repository }}
            Status: ${{ job.status }}
            See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: data-team@example.com
          from: GitHub Actions
